services:
  - type: web
    name: universe-backend
    runtime: node
    plan: free
    region: frankfurt
    rootDir: blueprint
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_SECRET
        generateValue: true
      - key: ADMIN_BOOTSTRAP_KEY
        generateValue: true
     - key: CORS_ORIGINS
  value: https://penguinmod.com,https://studio.penguinmod.com,https://codetorch.net,https://blockcompiler.codetorch.net,https://xNrep.github.io
      - key: PGSSL
        value: "true"
      - key: UDBA_ENABLED
        value: "false"
